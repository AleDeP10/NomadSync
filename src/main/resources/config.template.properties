# ------------------------------------------------------------------------------
# NomadSync - configuration template
#
# Copy this file to config.dev.properties or config.prod.properties,
# fill in your values, and keep it out of version control (.gitignore).
# ------------------------------------------------------------------------------

# -- Marker nesting protection --------------------------------------------------
# Maximum directory depth scanned downward from a candidate vault path when
# checking for nested markers belonging to other vaults. Ancestor scanning
# (upward, toward the filesystem root) is always unbounded and cross-type ?
# this limit applies only to the downward scan. Default: 6.
marker.maxNestingDepth=6

# -- Git -------------------------------------------------------------------------
# Full path to the git executable.
# On Windows use forward slashes or escape backslashes.
git.executable=C:/Program Files/Git/bin/git.exe
git.remote=origin
git.branch=main

# Global Git identity - used for commits when a vault does not override these.
# Per-vault credentials are configured in catalog.json.
git.name=YOUR_REAL_NAME
git.email=YOUR_EMAIL
git.username=YOUR_GITHUB_USERNAME
git.token=ghp_YOUR_DEV_TOKEN_HERE

# -- Socket ----------------------------------------------------------------------
# Host the SocketClient connects to. Default if absent: localhost
socket.host=localhost

# Port the SocketServer listens on.
socket.port=9090

# Retry delay in milliseconds for SocketClient reconnection attempts.
socket.retryDelay=30000

# -- Autosave ----------------------------------------------------------------------
# Interval in minutes between differential autosave commits.
autosave.interval.minutes=15

# -- Commit ------------------------------------------------------------------------
# Editor used for manual commit messages ('NomadSync commit').
# Resolution order: this property -> --editor flag -> EDITOR env var -> OS default.
commit.editor=notepad

# -- Logging -------------------------------------------------------------------------
# Comma-separated list of active writers: console, file, seq
# Default if absent: console,file
log.writers=console,file

# Required when log.writers includes "file"
log.path=C:/Users/YOURUSER/Tools/NomadSync/logs/nomadsync.log

# Minimum log level: DEBUG, INFO, WARN, ERROR
log.level=DEBUG

# Required when log.writers includes "seq"
# log.seq.url=http://localhost:5341
# log.seq.apiKey=YOUR_SEQ_API_KEY